name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  test-macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Unit tests on the system Python (3.9)
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Build the widget from source
        run: ./widget/build.sh
      - name: Widget self-test (parsers of files written by others)
        run: ./widget/build/TaskETA.app/Contents/MacOS/TaskETA --selftest
      - name: Render the demo panel
        run: ./widget/build/TaskETA.app/Contents/MacOS/TaskETA --snapshot "$RUNNER_TEMP/panel.png" --demo
