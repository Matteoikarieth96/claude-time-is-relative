name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  test-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests on the system Python (3.9)
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Build the widget from source
        run: ./widget/build.sh
      - name: Widget self-test (parsers of files written by others)
        run: ./widget/build/TaskETA.app/Contents/MacOS/TaskETA --selftest
      - name: Render the demo panel
        run: ./widget/build/TaskETA.app/Contents/MacOS/TaskETA --snapshot "$RUNNER_TEMP/panel.png" --demo
